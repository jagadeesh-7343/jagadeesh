<!DOCTYPE html>
<html>
<head>
    <title>Register with OTP</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
            margin-top: 100px;
        }

        .container {
            background-color: white;
            padding: 20px;
            width: 300px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px;
        }

        button {
            padding: 10px 20px;
            background-color: blue;
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: darkblue;
        }

        #otpSection {
            display: none;
        }

        #submitBtn {
            display: none;
        }

    </style>

</head>

<body>

<div class="container">

    <h2>Register</h2>

    <input type="text" id="phone" placeholder="Enter phone number">

    <button onclick="sendOTP()">Send OTP</button>

    <div id="otpSection">

        <input type="text" id="otp" placeholder="Enter OTP">

        <button onclick="verifyOTP()">Verify OTP</button>

        <!-- Submit button hidden initially -->
        <button id="submitBtn" onclick="goToLogin()">Submit</button>

    </div>

    <p id="message"></p>

</div>


<script>

let generatedOTP;

function sendOTP()
{
    let phone = document.getElementById("phone").value;

    if(phone.length != 10)
    {
        alert("Enter valid phone number");
        return;
    }

    generatedOTP = Math.floor(1000 + Math.random() * 9000);

    alert("Your OTP is: " + generatedOTP);

    document.getElementById("otpSection").style.display = "block";
}


function verifyOTP()
{
    let enteredOTP = document.getElementById("otp").value;

    if(enteredOTP == generatedOTP)
    {
        document.getElementById("message").innerHTML = "OTP Verified Successfully!";
        document.getElementById("message").style.color = "green";

        // Show submit button only after success
        document.getElementById("submitBtn").style.display = "inline-block";
    }
    else
    {
        document.getElementById("message").innerHTML = "Invalid OTP";
        document.getElementById("message").style.color = "red";
    }
}


function goToLogin()
{
    window.location.href = "login.html";
}

</script>

</body>
</html>
